version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cutm_pms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cutm_pms_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: pms_db
      DB_USER: root
      DB_PASSWORD: lokesh
      REDIS_URL: redis://redis:6379
      JWT_SECRET: pms-super-secret-jwt-key-2024-change-in-production
      JWT_EXPIRE: 24h
      REFRESH_TOKEN_EXPIRE: 7d
      API_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
      - ./api/node_modules:/app/node_modules
    command: npm run dev

volumes:
  redis_data:

networks:
  default:
    name: cutm_pms_network
