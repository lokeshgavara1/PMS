version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cutm_pms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lokesh
      MYSQL_DATABASE: pms_db
      MYSQL_USER: pms_user
      MYSQL_PASSWORD: pms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cutm_pms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cutm_pms_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: pms_db
      DB_USER: pms_user
      DB_PASSWORD: pms_password
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRE: 1h
      REFRESH_TOKEN_EXPIRE: 7d
      API_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
      - ./api/node_modules:/app/node_modules
    command: npm run dev

  mock-intern-api:
    build:
      context: ./mock-intern-api
      dockerfile: Dockerfile
    container_name: cutm_pms_mock_intern
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
    command: npm start

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    name: cutm_pms_network
