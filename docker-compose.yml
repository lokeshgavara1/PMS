version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cutm_pms_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: pms_db
      DB_USER: root
      DB_PASSWORD: lokesh
      JWT_SECRET: pms-super-secret-jwt-key-2024-change-in-production
      JWT_EXPIRE: 24h
      REFRESH_TOKEN_EXPIRE: 7d
      API_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./api/src:/app/src
      - ./api/node_modules:/app/node_modules
    command: npm run dev

networks:
  default:
    name: cutm_pms_network
